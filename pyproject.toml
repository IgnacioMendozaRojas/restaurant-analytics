[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "restaurant-analytics"
version = "0.1.0"
description = "Menu engineering, recipe costing with yields and unit economics for a fast-casual restaurant"
readme = "README.md"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "numpy>=1.26"]

[project.optional-dependencies]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/menu_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E501"]
